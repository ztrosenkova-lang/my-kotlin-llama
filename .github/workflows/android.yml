name: Android CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Fix Line Endings (CRLF to LF)
        run: |
          sudo apt-get update && sudo apt-get install -y dos2unix
          dos2unix gradlew
          dos2unix gradle/wrapper/gradle-wrapper.properties

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Pre-Download and Embed Neural TTS Model Assets
        run: |
          mkdir -p app/src/main/assets/tts-model
          cd app/src/main/assets/tts-model
          echo "Downloading Dasha Neural TTS Voice Model Asset..."
          curl -L -o vits-ru-hf-dasha-medium.zip "https://huggingface.co/csukuangfj/sherpa-onnx-tts-vits-ru-hf-dasha-medium/resolve/main/vits-ru-hf-dasha-medium.zip?download=true"
          echo "Extracting Neural Voice Assets Layer..."
          unzip -q vits-ru-hf-dasha-medium.zip
          echo "Flattening model directory tree..."
          mv vits-ru-hf-dasha-medium/* . || true
          echo "Cleaning up compilation cache metadata..."
          rm -rf vits-ru-hf-dasha-medium vits-ru-hf-dasha-medium.zip
          echo "Verifying local assets target location mapping content:"
          ls -la
          echo "Sherpa-ONNX Neural Speech Package ready inside assets"

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

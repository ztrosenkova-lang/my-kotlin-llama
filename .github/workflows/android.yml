name: Android CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Fix Line Endings (CRLF to LF)
        run: |
          sudo apt-get update && sudo apt-get install -y dos2unix
          dos2unix gradlew
          dos2unix gradle/wrapper/gradle-wrapper.properties

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Create TTS Assets Directory
        run: mkdir -p app/src/main/assets/tts-model

      - name: Download Piper TTS Model Configuration
        run: |
          curl -L "https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU/robot-medium/ru_RU-robot-medium.onnx.json" \
          -o "app/src/main/assets/tts-model/ru_RU-robot-medium.onnx.json"

      - name: Download Piper TTS Model Weights
        run: |
          curl -L "https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU/robot-medium/ru_RU-robot-medium.onnx" \
          -o "app/src/main/assets/tts-model/ru_RU-robot-medium.onnx"

      - name: Decode Keystore from Secret
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore

      - name: Verify Keystore File
        run: |
          if [ -f "app/release.keystore" ]; then
            echo "✅ Keystore file exists"
            ls -la app/release.keystore
          else
            echo "❌ Keystore file NOT found!"
            exit 1
          fi

      - name: Build Release APK with Signing
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
